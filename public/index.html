<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ayo</title>
    <meta
      name="description"
      content="Identity links for ayo are active. Personal progress stays local on device."
    >
    <style>
      :root {
        color-scheme: light;
        --bg-top: #f7efe3;
        --bg-bottom: #fff9f3;
        --card: rgba(255, 255, 255, 0.82);
        --border: rgba(108, 84, 62, 0.12);
        --ink: #2b241d;
        --muted: #6d6257;
        --accent: #e89d62;
        --accent-deep: #c86f2b;
        --shadow: rgba(101, 72, 44, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "SF Pro Display", "SF Pro Text", "Avenir Next", system-ui, sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at top left, rgba(255, 255, 255, 0.95), transparent 38%),
          linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
      }

      .shell {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 20px;
      }

      .card {
        width: min(100%, 560px);
        padding: 32px;
        border-radius: 28px;
        background: var(--card);
        border: 1px solid var(--border);
        box-shadow: 0 24px 70px var(--shadow);
        backdrop-filter: blur(18px);
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(232, 157, 98, 0.14);
        color: var(--accent-deep);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 18px 0 10px;
        font-size: clamp(40px, 8vw, 58px);
        line-height: 0.96;
        letter-spacing: -0.04em;
      }

      p {
        margin: 0;
        font-size: 17px;
        line-height: 1.6;
        color: var(--muted);
      }

      .lead {
        margin-top: 18px;
        font-size: 20px;
        color: var(--ink);
      }

      .note {
        margin-top: 24px;
        padding: 18px 20px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.66);
        border: 1px solid rgba(108, 84, 62, 0.1);
      }

      footer {
        margin-top: 28px;
        font-size: 14px;
        color: var(--muted);
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 0 6px rgba(232, 157, 98, 0.14);
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <section class="card" aria-label="ayo auth support page">
        <div class="eyebrow">
          <span class="dot" aria-hidden="true"></span>
          Identity active
        </div>

        <h1>ayo</h1>

        <p class="lead">Identity links for ayo are active.</p>
        <p>
          This lightweight page supports account and authentication links for the ayo iPhone app.
        </p>

        <div class="note">
          <p>
            Personal progress stays local on device. Firebase here is only used to support account
            identity and sign-in flows.
          </p>
        </div>

        <footer>Auth and account support page</footer>
      </section>
    </main>
  </body>
  </html>
